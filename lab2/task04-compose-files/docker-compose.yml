services:
  web:
    build: .
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: '128M'
    ports:
      # ВПИШИТЕ порт приложения (см. app.run в app.py): "ПОРТ:ПОРТ"
      - "5001:5001"
    depends_on:
      - db
    

  db:
    # ВПИШИТЕ образ PostgreSQL версии 13:
    image: postgres:13
    ports:
      - "15432:5432"
    environment:
      POSTGRES_PASSWORD: mysecretpassword   # ВПИШИТЕ пароль (как в app.py)
      POSTGRES_DB: mydb


    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
